<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Compare Yahoo Fantasy Basketball category strength across your league." />
    <title>Slackbrahs Fantasy Tool</title>
    <link rel="icon" href="/slackbrahs-icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="/slackbrahs-icon.png" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div class="brand-lockup">
          <img class="app-mark" src="/slackbrahs-icon.png" alt="" />
          <p class="eyebrow">Yahoo Fantasy Basketball</p>
          <h1>Slackbrahs Fantasy Tool</h1>
        </div>
        <div class="auth-actions">
          <div class="profile-menu hidden" id="profileMenu">
            <button class="button ghost profile-button" id="profileButton" type="button" aria-haspopup="menu" aria-controls="profilePopover" aria-expanded="false">
              <span class="profile-avatar" id="profileAvatar" aria-hidden="true">?</span>
              <span>Profile</span>
              <span class="select-chevron" aria-hidden="true"></span>
            </button>
            <div class="profile-popover hidden" id="profilePopover" role="menu" aria-labelledby="profileButton">
              <div class="profile-details">
                <strong id="profileName">Not signed in</strong>
              </div>
              <div class="profile-divider"></div>
              <button class="profile-action" id="themeToggle" type="button" role="menuitem" aria-pressed="true">Light mode</button>
              <a class="profile-action hidden" id="signOutButton" href="/auth/logout" role="menuitem">Sign out</a>
            </div>
          </div>
          <a class="button primary" id="signInButton" href="/auth/yahoo">Sign in with Yahoo</a>
        </div>
      </section>

      <section class="controls hidden" id="controls" aria-label="League controls">
        <label>
          League
          <select id="leagueSelect" disabled>
            <option>Sign in to load leagues</option>
          </select>
        </label>
        <label>
          Week
          <div class="week-picker" id="weekPicker">
            <button
              class="week-picker-button"
              id="weekPickerButton"
              type="button"
              aria-haspopup="listbox"
              aria-controls="weekPickerMenu"
              aria-expanded="false"
              disabled
            >
              <span id="weekPickerValue">Select week</span>
              <span class="select-chevron" aria-hidden="true"></span>
            </button>
            <div class="week-picker-menu hidden" id="weekPickerMenu" role="listbox" tabindex="-1"></div>
            <select id="weekInput" class="visually-hidden" tabindex="-1" aria-hidden="true" disabled>
              <option value="">Select week</option>
            </select>
          </div>
        </label>
        <button id="loadButton" class="button secondary" disabled>Load week</button>
        <label class="checkbox-label">
          <input id="showRanks" type="checkbox" checked />
          <span>Show team ranks per category</span>
        </label>
      </section>

      <nav class="view-tabs hidden" id="viewTabs" aria-label="Weekly views" role="tablist">
        <button id="comparisonTab" class="view-tab active" type="button" role="tab" aria-controls="scoreboard" aria-selected="true" tabindex="0">Weekly comparison</button>
        <button id="strengthsTab" class="view-tab" type="button" role="tab" aria-controls="scoreboard" aria-selected="false" tabindex="-1">Category strengths</button>
        <button id="averagesTab" class="view-tab" type="button" role="tab" aria-controls="scoreboard" aria-selected="false" tabindex="-1">League averages</button>
      </nav>

      <section class="status-row">
        <div class="status" id="status">
          Sign in with Yahoo to compare weekly category totals across your league.
        </div>
        <button id="retryLeaguesButton" class="button ghost hidden" type="button">Retry loading leagues</button>
      </section>

      <section id="scoreboard" class="scoreboard" role="tabpanel" aria-live="polite"></section>
    </main>
    <a
      class="donation-fab"
      href="https://buymeacoffee.com/slackbrahsfantasy"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Support Slackbrahs Fantasy Tool on Buy Me a Coffee"
    >
      <svg width="29" height="40" viewBox="0 0 48 64" aria-hidden="true" focusable="false">
        <defs>
          <clipPath id="bowlingPinClip">
            <path d="M24 2C17.9 2 13.7 6.6 13.7 12.8c0 5.1 2 9 1.1 13.7C13.3 34.2 5 42.6 5 51.8 5 59.8 12.8 63 24 63s19-3.2 19-11.2c0-9.2-8.3-17.6-9.8-25.3-.9-4.7 1.1-8.6 1.1-13.7C34.3 6.6 30.1 2 24 2Z" />
          </clipPath>
        </defs>
        <path
          d="M24 2C17.9 2 13.7 6.6 13.7 12.8c0 5.1 2 9 1.1 13.7C13.3 34.2 5 42.6 5 51.8 5 59.8 12.8 63 24 63s19-3.2 19-11.2c0-9.2-8.3-17.6-9.8-25.3-.9-4.7 1.1-8.6 1.1-13.7C34.3 6.6 30.1 2 24 2Z"
          fill="#fff"
          stroke="rgba(24, 32, 51, .22)"
          stroke-width="1.5"
        />
        <g clip-path="url(#bowlingPinClip)" fill="#e34f5f">
          <path d="M9 15.5c4.8 1.3 9.8 1.9 15 1.9s10.2-.6 15-1.9v5.2c-4.8 1.3-9.8 1.9-15 1.9s-10.2-.6-15-1.9Z" />
          <path d="M9 22.9c4.8 1.3 9.8 1.9 15 1.9s10.2-.6 15-1.9v4.5c-4.8 1.3-9.8 1.9-15 1.9s-10.2-.6-15-1.9Z" />
        </g>
      </svg>
      <span class="donation-label">Donate</span>
    </a>
    <script src="/client.js" type="module"></script>
  </body>
</html>
